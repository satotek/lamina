name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs build the same artifacts but publish nothing; the archives are
  # left in the run for inspection.
  workflow_dispatch:

concurrency:
  # A half-uploaded release is worse than a duplicate run, so never cancel one.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # The About window embeds this rather than asking git, because a packaged
  # checkout may not carry a .git directory.
  LAMINA_BUILD_COMMIT: ${{ github.sha }}
  # The app and the bundled lamina-remote binaries compare this token. It has
  # to be the same value for every job in the run; a mismatch makes the app
  # reject its own helper. build.rs embeds it (option_env! alone would not
  # invalidate a cached crate).
  LAMINA_BUILD_ID: ${{ github.sha }}
  # crates/lamina-term/build.rs refuses any other Zig version.
  ZIG_VERSION: "0.17.1"
  # Linux releases build on ubuntu-22.04 for an older glibc floor. Its newest
  # libstdc++ headers are version 12, matching the gcc 12 clang picks there.
  LINUX_PACKAGES: >-
    build-essential
    clang
    cmake
    curl
    elfutils
    gcc
    g++
    git
    jq
    libasound2-dev
    libfontconfig-dev
    libfreetype-dev
    libgit2-dev
    libglib2.0-dev
    libsqlite3-dev
    libssl-dev
    libstdc++-12-dev
    libva-dev
    libvulkan-dev
    libwayland-dev
    libx11-xcb-dev
    libxcb1-dev
    libxkbcommon-dev
    libxkbcommon-x11-dev
    libzstd-dev
    lld
    llvm
    make
    musl-dev
    musl-tools
    pkg-config

permissions:
  contents: read

jobs:
  version:
    name: check tag against Cargo.toml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1

      # The tag is the only thing that names a release, and the packaging
      # scripts read the version from the manifest, so a mismatch would publish
      # artifacts whose file names disagree with the tag.
      - name: Read the workspace version and compare it with the tag
        id: read
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match [workspace.package] version ${version}" >&2
            exit 1
          fi
          echo "building Lamina ${version}"

  # One build of the two Linux musl helpers, shared by every platform archive.
  # The app looks for remote-helpers/ beside its own executable and uploads the
  # file that matches the remote machine. aarch64 has no native musl linker on
  # this runner; cargo-zigbuild uses the Zig toolchain already pinned above.
  remote-helpers:
    name: build remote helpers
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        run: rustup show

      - name: Add the musl targets
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Install Zig
        uses: vercel-labs/setup-zig@v1.0.2
        with:
          version: ${{ env.ZIG_VERSION }}

      # 0.23.4 is the revision exercised with Zig 0.17.1. install-action
      # resolves the @version from GitHub releases rather than floating latest.
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-zigbuild@0.23.4

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Build the helpers
        run: scripts/build-remote-helpers.sh "$GITHUB_WORKSPACE/remote-helpers"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: remote-helpers
          path: remote-helpers/
          if-no-files-found: error
          retention-days: 7

  build:
    name: build (${{ matrix.name }})
    needs: [version, remote-helpers]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      # Packaging scripts copy this directory next to the executable. An
      # absolute path so a script that changes directory still finds it.
      REMOTE_HELPERS: ${{ github.workspace }}/remote-helpers
      # A step's `if:` cannot read a secret, so the presence test is computed
      # here; the certificate itself only reaches the step that imports it.
      HAS_SIGNING_P12: ${{ secrets.STRATA_SIGNING_P12 != '' }}
      # Self-signed, so signing needs no Apple Developer Program membership.
      # packaging/macos/SIGNING.md describes the certificate and the secrets.
      SIGNING_IDENTITY: Strata Code Signing
    strategy:
      fail-fast: false
      matrix:
        # macOS ships for Apple silicon only; Intel Macs are not a target.
        # ubuntu-22.04 is the oldest runner still hosted, which keeps the
        # glibc floor at 2.35 for the Linux archive.
        include:
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          name: remote-helpers
          path: remote-helpers

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # LINUX_PACKAGES is one package per line; xargs turns it into
          # arguments, which avoids relying on unquoted word splitting.
          sudo apt-get update
          printf '%s\n' "$LINUX_PACKAGES" | xargs sudo apt-get install -y

      - name: Install Rust toolchain
        run: rustup show

      - name: Add the target triple
        run: rustup target add ${{ matrix.target }}

      # libghostty-vt is compiled from source by crates/lamina-term/build.rs,
      # which checks the toolchain version before downloading anything.
      # This setup action runs on Node 24; the more common one still targets
      # the deprecated Node 20 runtime.
      - name: Install Zig
        uses: vercel-labs/setup-zig@v1.0.2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache libghostty-vt
        uses: actions/cache@v6.1.0
        with:
          path: target/ghostty-vt-cache
          key: ghostty-vt-${{ env.ZIG_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/lamina-term/build.rs') }}

      - uses: Swatinem/rust-cache@v2.9.3

      # The notices are generated here rather than checked in so they always
      # describe the lockfile that produced the binaries.
      - name: Install cargo-about
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-about

      - name: Generate third-party notices
        shell: bash
        run: packaging/third-party/generate.sh dist/THIRD-PARTY-NOTICES.md

      # The certificate is self-signed, so this needs no Apple Developer
      # Program membership. Its only job is a designated requirement that
      # stays the same across releases, which is what lets an update keep the
      # user's Keychain and privacy grants. See packaging/macos/SIGNING.md.
      - name: Import the signing certificate
        if: runner.os == 'macOS' && env.HAS_SIGNING_P12 == 'true'
        env:
          SIGNING_P12: ${{ secrets.STRATA_SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.STRATA_SIGNING_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"

          security create-keychain -p "$keychain_password" "$keychain"
          # Allowed to relock after an hour rather than staying unlocked on the
          # runner for the rest of the job.
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" \
            -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          # Lets codesign use the key without a GUI prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          # The runner's existing keychains stay in the list; this one goes
          # first because codesign searches in order.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"

      - name: Note the ad-hoc signing fallback
        if: runner.os == 'macOS' && env.HAS_SIGNING_P12 != 'true'
        run: |
          echo "::warning::LAMINA_SIGNING_P12 is not set, so Lamina.app is signed ad hoc and its identity changes with every release"

      - name: Build, bundle and create the disk image
        if: runner.os == 'macOS'
        run: |
          if [ "$HAS_SIGNING_P12" = 'true' ]; then
            packaging/macos/bundle.sh --target ${{ matrix.target }} --sign "$SIGNING_IDENTITY"
          else
            packaging/macos/bundle.sh --target ${{ matrix.target }}
          fi
          # The helpers are a symlink under Contents/MacOS; codesign seals that
          # link, and the Linux binaries themselves live in Resources.
          codesign --verify --verbose=2 dist/Lamina.app
          test -L dist/Lamina.app/Contents/MacOS/remote-helpers
          test -x dist/Lamina.app/Contents/MacOS/remote-helpers/lamina-remote-x86_64-unknown-linux-musl
          test -x dist/Lamina.app/Contents/MacOS/remote-helpers/lamina-remote-aarch64-unknown-linux-musl
          packaging/macos/dmg.sh --target ${{ matrix.target }}
          hdiutil verify dist/*.dmg

      # A designated requirement naming the certificate, rather than a cdhash,
      # is what keeps the app the same app across updates.
      - name: Verify the app signature
        if: runner.os == 'macOS' && env.HAS_SIGNING_P12 == 'true'
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Lamina.app
          codesign -dr - dist/Lamina.app

      # The runner image also carries Inno Setup, but its version drifts with
      # image updates; a pinned choco package keeps the installer's build
      # tool, and therefore its output, stable.
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y --version 6.7.1

      - name: Build, zip and package the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging/windows/package.ps1 -Target '${{ matrix.target }}' -Installer

      - name: Build and create the tarball
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          packaging/linux/package.sh --target ${{ matrix.target }}
          tmp=$(mktemp -d)
          tar -xzf dist/lamina-*-linux-*.tar.gz -C "$tmp"
          # The archive unpacks into lamina-<version>-linux-<arch>/.
          package=$(find "$tmp" -mindepth 1 -maxdepth 1 -type d -name 'lamina-*')
          PREFIX="$tmp/prefix" "$package/install.sh"
          test -x "$tmp/prefix/bin/lamina"
          test -f "$tmp/prefix/share/applications/lamina.desktop"
          test -f "$tmp/prefix/share/icons/hicolor/512x512/apps/lamina.png"
          test -f "$tmp/prefix/share/doc/lamina/THIRD-PARTY-NOTICES.md"
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            helper="$tmp/prefix/bin/remote-helpers/lamina-remote-$target"
            test -x "$helper"
            mode=$(stat -c %a "$helper")
            test "$mode" = "755"
          done

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
          if-no-files-found: error
          retention-days: 7

      # Also on failure, so a broken build cannot leave the key on the runner.
      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS' && env.HAS_SIGNING_P12 == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  publish:
    name: create draft release
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job writes to the repository; every build job above is read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      # dist-* only. The remote-helpers artifact is an input to the build
      # jobs; publishing it would add loose binaries to the release and to
      # SHA256SUMS.txt.
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # The signatures are only as trustworthy as the tool that writes them, so
      # this takes a pinned release and checks its digest instead of whatever
      # version the runner image happens to ship.
      - name: Install minisign
        run: |
          set -euo pipefail
          version=0.12
          sha256=9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
          url="https://github.com/jedisct1/minisign/releases/download/${version}/minisign-${version}-linux.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/minisign.tar.gz" "$url"
          echo "${sha256}  ${RUNNER_TEMP}/minisign.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/minisign.tar.gz" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/minisign-linux/x86_64" >>"$GITHUB_PATH"

      # Signing needs a key that forks and manual runs do not have. Without it
      # the release is still usable by hand, it just has no update feed, so the
      # step warns and moves on instead of failing.
      - name: Sign the assets and write the update manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          UPDATE_KEY: ${{ secrets.STRATA_UPDATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_KEY" ]; then
            echo "::warning::LAMINA_UPDATE_KEY is not set; the archives are unsigned and latest.json is skipped"
            exit 0
          fi
          # The key only ever exists as a file: passing it as an argument would
          # put it in the process list and in the step log.
          key="$RUNNER_TEMP/lamina-update.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$UPDATE_KEY" >"$key")
          chmod 600 "$key"
          packaging/release/update-manifest.sh --key "$key" dist "$VERSION" "$GITHUB_REF_NAME"

      # `*` picks up the .minisig files and latest.json written above, so the
      # sums cover everything the release publishes.
      - name: Write SHA256SUMS.txt
        run: |
          cd dist
          sha256sum -- * >SHA256SUMS.txt
          cat SHA256SUMS.txt

      # --draft keeps the release invisible until a human reviews the artifacts
      # and the generated notes. Re-running the workflow for a tag that already
      # has a release replaces its assets instead of failing.
      - name: Create or refresh the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" --draft \
              --title "Lamina ${VERSION}" --generate-notes dist/*
          fi
