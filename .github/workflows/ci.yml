name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # PRs share a ref across pushes, so a new push cancels the previous run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the channel and components; this makes rustup
      # materialise the toolchain before the first cargo invocation.
      - run: rustup show
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Mirrors the apt list in zed-industries/zed `script/linux`, which is the
      # authoritative set of native dependencies for GPUI on Debian-likes.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            curl \
            elfutils \
            gcc \
            g++ \
            git \
            jq \
            libasound2-dev \
            libfontconfig-dev \
            libfreetype-dev \
            libgit2-dev \
            libglib2.0-dev \
            libsqlite3-dev \
            libssl-dev \
            libstdc++-14-dev \
            libva-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            lld \
            llvm \
            make \
            musl-dev \
            musl-tools \
            pkg-config

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # Tests shell out to `git` to build fixtures; runners have no global
      # identity, and commits without one fail.
      - name: Configure git
        run: |
          git config --global user.name "Strata CI"
          git config --global user.email "ci@strata.invalid"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
