name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # PRs share a ref across pushes, so a new push cancels the previous run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # crates/strata-term/build.rs refuses any other Zig version.
  ZIG_VERSION: "0.17.1"
  # The caches below ship `target/` between runs, so artifact size is upload
  # and storage time. Line tables still give file:line in a panic backtrace and
  # halve the cached tree; incremental state cannot be reused by another runner
  # anyway.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"
  # Bump to abandon every cached `target/` tree after changing what goes in it.
  CI_CACHE_VERSION: v1
  # GPUI's native Linux dependencies.
  LINUX_PACKAGES: >-
    build-essential
    clang
    cmake
    curl
    elfutils
    gcc
    g++
    git
    jq
    libasound2-dev
    libfontconfig-dev
    libfreetype-dev
    libgit2-dev
    libglib2.0-dev
    libsqlite3-dev
    libssl-dev
    libstdc++-14-dev
    libva-dev
    libvulkan-dev
    libwayland-dev
    libx11-xcb-dev
    libxcb1-dev
    libxkbcommon-dev
    libxkbcommon-x11-dev
    libzstd-dev
    lld
    llvm
    make
    musl-dev
    musl-tools
    pkg-config

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      # rust-toolchain.toml pins the channel and components; this makes rustup
      # materialise the toolchain before the first cargo invocation.
      - run: rustup show
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Clippy emits metadata instead of codegen, so its `target/` shares almost
      # nothing with the one the test job produces; each lane owns its cache.
      CI_LANE: clippy
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # LINUX_PACKAGES is one package per line; xargs turns it into
          # arguments, which avoids relying on unquoted word splitting.
          sudo apt-get update
          printf '%s\n' "$LINUX_PACKAGES" | xargs sudo apt-get install -y

      - name: Install Rust toolchain
        run: rustup show

      # `cargo clippy` still compiles and runs build scripts, and
      # crates/strata-term/build.rs builds libghostty-vt with Zig.
      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Compute cache key
        id: cache-key
        shell: bash
        run: |
          echo "rustc=$(rustc -vV | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
          echo "sources=${{ hashFiles('Cargo.toml', '**/Cargo.toml', 'Cargo.lock', 'crates/strata-term/build.rs', 'rust-toolchain.toml', '.github/workflows/ci.yml', 'scripts/ci-sources') }}" >> "$GITHUB_OUTPUT"

      # The whole `target/` is cached, not just resolved dependencies: without
      # the workspace artifacts every run recompiles strata-app from scratch,
      # which is most of the job. build.rs keeps its libghostty-vt archive and
      # tarballs under target/ghostty-vt-cache, so they ride along.
      #
      # The key only covers files that change the dependency graph or the
      # compiler. A source-only push therefore hits the primary key and saves
      # nothing, which keeps one cache per OS instead of one per commit.
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: strata-${{ runner.os }}-${{ runner.arch }}-${{ env.CI_LANE }}-${{ env.CI_CACHE_VERSION }}-${{ steps.cache-key.outputs.rustc }}-${{ env.ZIG_VERSION }}-${{ steps.cache-key.outputs.sources }}
          restore-keys: |
            strata-${{ runner.os }}-${{ runner.arch }}-${{ env.CI_LANE }}-${{ env.CI_CACHE_VERSION }}-${{ steps.cache-key.outputs.rustc }}-

      # Checkout stamps every file with the current time, which makes cargo
      # consider every cached artifact stale. Rewind the mtimes of unchanged
      # files so only the crates a push touched are rebuilt.
      - name: Restore source mtimes
        shell: bash
        # Windows images expose the interpreter as `python` only.
        run: |
          python=$(command -v python3 || command -v python)
          "$python" scripts/ci-sources restore

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Record source mtimes
        if: always()
        shell: bash
        # Windows images expose the interpreter as `python` only.
        run: |
          python=$(command -v python3 || command -v python)
          "$python" scripts/ci-sources record

      # Refuse to write caches from pull requests and other branches: they
      # would evict the ones main keeps warm, and the next main run rebuilds.
      - name: Save cargo cache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          key: strata-${{ runner.os }}-${{ runner.arch }}-${{ env.CI_LANE }}-${{ env.CI_CACHE_VERSION }}-${{ steps.cache-key.outputs.rustc }}-${{ env.ZIG_VERSION }}-${{ steps.cache-key.outputs.sources }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CI_LANE: test
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # LINUX_PACKAGES is one package per line; xargs turns it into
          # arguments, which avoids relying on unquoted word splitting.
          sudo apt-get update
          printf '%s\n' "$LINUX_PACKAGES" | xargs sudo apt-get install -y

      - name: Install Rust toolchain
        run: rustup show

      # libghostty-vt is built from source by crates/strata-term/build.rs, which
      # checks the toolchain version before downloading anything.
      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Compute cache key
        id: cache-key
        shell: bash
        run: |
          echo "rustc=$(rustc -vV | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
          echo "sources=${{ hashFiles('Cargo.toml', '**/Cargo.toml', 'Cargo.lock', 'crates/strata-term/build.rs', 'rust-toolchain.toml', '.github/workflows/ci.yml', 'scripts/ci-sources') }}" >> "$GITHUB_OUTPUT"

      # The whole `target/` is cached, not just resolved dependencies: without
      # the workspace artifacts every run recompiles strata-app from scratch,
      # which is most of the job. build.rs keeps its libghostty-vt archive and
      # tarballs under target/ghostty-vt-cache, so they ride along.
      #
      # The key only covers files that change the dependency graph or the
      # compiler. A source-only push therefore hits the primary key and saves
      # nothing, which keeps one cache per OS instead of one per commit.
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: strata-${{ runner.os }}-${{ runner.arch }}-${{ env.CI_LANE }}-${{ env.CI_CACHE_VERSION }}-${{ steps.cache-key.outputs.rustc }}-${{ env.ZIG_VERSION }}-${{ steps.cache-key.outputs.sources }}
          restore-keys: |
            strata-${{ runner.os }}-${{ runner.arch }}-${{ env.CI_LANE }}-${{ env.CI_CACHE_VERSION }}-${{ steps.cache-key.outputs.rustc }}-

      # Checkout stamps every file with the current time, which makes cargo
      # consider every cached artifact stale. Rewind the mtimes of unchanged
      # files so only the crates a push touched are rebuilt.
      - name: Restore source mtimes
        shell: bash
        # Windows images expose the interpreter as `python` only.
        run: |
          python=$(command -v python3 || command -v python)
          "$python" scripts/ci-sources restore

      # Tests shell out to `git` to build fixtures; runners have no global
      # identity, and commits without one fail.
      - name: Configure git
        run: |
          git config --global user.name "Strata CI"
          git config --global user.email "ci@strata.invalid"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-nextest@0.9.152

      # nextest runs one process per test, so the ~25 test binaries no longer
      # queue behind each other on the runner's cores.
      - name: Test
        run: cargo nextest run --workspace --no-fail-fast

      # nextest does not run doctests, and leaving them out of CI would silently
      # drop the examples in the public API docs.
      - name: Test doctests
        run: cargo test --workspace --doc --no-fail-fast

      - name: Record source mtimes
        if: always()
        shell: bash
        # Windows images expose the interpreter as `python` only.
        run: |
          python=$(command -v python3 || command -v python)
          "$python" scripts/ci-sources record

      # Refuse to write caches from pull requests and other branches: they
      # would evict the ones main keeps warm, and the next main run rebuilds.
      - name: Save cargo cache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          key: strata-${{ runner.os }}-${{ runner.arch }}-${{ env.CI_LANE }}-${{ env.CI_CACHE_VERSION }}-${{ steps.cache-key.outputs.rustc }}-${{ env.ZIG_VERSION }}-${{ steps.cache-key.outputs.sources }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target

  no-terminal:
    name: clippy (no terminal feature)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_LANE: clippy-no-terminal
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux dependencies
        run: |
          # LINUX_PACKAGES is one package per line; xargs turns it into
          # arguments, which avoids relying on unquoted word splitting.
          sudo apt-get update
          printf '%s\n' "$LINUX_PACKAGES" | xargs sudo apt-get install -y

      - name: Install Rust toolchain
        run: rustup show

      - name: Compute cache key
        id: cache-key
        shell: bash
        run: |
          echo "rustc=$(rustc -vV | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
          echo "sources=${{ hashFiles('Cargo.toml', '**/Cargo.toml', 'Cargo.lock', 'crates/strata-term/build.rs', 'rust-toolchain.toml', '.github/workflows/ci.yml', 'scripts/ci-sources') }}" >> "$GITHUB_OUTPUT"

      # The feature set differs from the workspace clippy lane, so the artifacts
      # do too; sharing a cache would make both lanes rebuild each other's work.
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: strata-${{ runner.os }}-${{ runner.arch }}-${{ env.CI_LANE }}-${{ env.CI_CACHE_VERSION }}-${{ steps.cache-key.outputs.rustc }}-${{ env.ZIG_VERSION }}-${{ steps.cache-key.outputs.sources }}
          restore-keys: |
            strata-${{ runner.os }}-${{ runner.arch }}-${{ env.CI_LANE }}-${{ env.CI_CACHE_VERSION }}-${{ steps.cache-key.outputs.rustc }}-

      - name: Restore source mtimes
        shell: bash
        # Windows images expose the interpreter as `python` only.
        run: |
          python=$(command -v python3 || command -v python)
          "$python" scripts/ci-sources restore

      # No Zig step here on purpose: the point of this job is that the app
      # still builds when the terminal feature, and with it libghostty-vt, is
      # turned off.
      - name: Clippy without the terminal feature
        run: cargo clippy -p strata-app --no-default-features --all-targets -- -D warnings

      - name: Record source mtimes
        if: always()
        shell: bash
        # Windows images expose the interpreter as `python` only.
        run: |
          python=$(command -v python3 || command -v python)
          "$python" scripts/ci-sources record

      - name: Save cargo cache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          key: strata-${{ runner.os }}-${{ runner.arch }}-${{ env.CI_LANE }}-${{ env.CI_CACHE_VERSION }}-${{ steps.cache-key.outputs.rustc }}-${{ env.ZIG_VERSION }}-${{ steps.cache-key.outputs.sources }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
