[workspace]
resolver = "3"
members = ["crates/strata-core", "crates/strata-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
strata-core = { path = "crates/strata-core" }

# The phase-0 benchmark has to be judged on release builds, where frame pacing
# is not dominated by unoptimised element layout.
# Full debug info made up most of target/ (several GB per worktree). Line
# tables keep file:line in backtraces; dependencies need none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
