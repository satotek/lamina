[workspace]
resolver = "3"
members = [
    "crates/lamina-core",
    "crates/lamina-app",
    "crates/lamina-term",
    "crates/lamina-remote-protocol",
    "crates/lamina-remote-client",
    "crates/lamina-remote",
]

[workspace.package]
version = "0.4.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Lightweight cross-platform git client"
repository = "https://github.com/satotek/lamina"
homepage = "https://github.com/satotek/lamina"

[workspace.dependencies]
lamina-core = { path = "crates/lamina-core" }
lamina-remote-protocol = { path = "crates/lamina-remote-protocol" }
lamina-remote-client = { path = "crates/lamina-remote-client" }

# The phase-0 benchmark has to be judged on release builds, where frame pacing
# is not dominated by unoptimised element layout.
# Full debug info made up most of target/ (several GB per worktree). Line
# tables keep file:line in backtraces; dependencies need none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
