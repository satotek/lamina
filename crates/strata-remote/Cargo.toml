[package]
name = "strata-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Headless repository helper for Strata over a byte stream"

[lib]
path = "src/lib.rs"

[[bin]]
name = "strata-remote"
path = "src/main.rs"

[dependencies]
strata-core = { workspace = true }
strata-remote-protocol = { workspace = true }

[dev-dependencies]
strata-core = { workspace = true, features = ["test-support"] }
strata-remote-client = { workspace = true }
