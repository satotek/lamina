[package]
name = "strata-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "strata"
path = "src/main.rs"

[features]
default = ["terminal"]
terminal = ["dep:strata-term"]

[dependencies]
strata-core.workspace = true
strata-term = { path = "../strata-term", optional = true }

# GPUI itself is published to crates.io under `gpui-pre` by the GPUI Kit
# maintainers; the library is still named `gpui`, so the package rename keeps
# `use gpui::…` working. `=0.3.12` matches what gpui-component pins.
gpui = { package = "gpui-pre", version = "=0.3.12" }
# `font-kit` is macOS-only in effect: without it gpui_macos has no text system
# and every glyph and icon silently fails to draw.
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", features = [
    "font-kit",
    "wayland",
    "x11",
] }
gpui-component = "0.9.1"
# gpui-component draws its icons (window controls, menus, checkboxes) from SVGs
# looked up through the app's AssetSource; without this bundle they render as
# empty boxes.
gpui-kit-assets = "0.9.1"

# GPUI logs through `log`; without a logger its warnings (display server,
# GPU adapter, window creation) are silent, which makes headless triage blind.
env_logger = "0.11"

# Only for `mpsc`: session events arrive on background threads and are drained
# by one foreground task, so the UI never blocks on git work.
futures = "0.3"

# The UI text lives in `locales/en.yml` and `locales/ja.yml`, embedded at
# compile time. `=4.2.4` was released on 2026-09-29.
rust-i18n = "=4.2.4"

# App settings are one JSON file in the platform config directory.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
log = "0.4"

# Blocking HTTP client for checking and downloading updates on the background
# executor; rustls with the platform verifier avoids an async runtime, system
# OpenSSL dependencies, and bundled root-certificate crates. `socks-proxy`
# lets ureq route updates through configured SOCKS4/SOCKS5 proxies.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "gzip", "socks-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Stores the manual proxy password in the OS credential store rather than
# plaintext `settings.json`. Only `v1` is enabled, keeping the backend set to
# macOS Keychain, Windows Credential Manager, and pure-Rust zbus Secret Service
# on Linux without pulling in extra cloud/hardware or system-dbus bindings.
keyring = { version = "4", default-features = false, features = ["v1"] }

# Verifies release manifests and downloaded installers against the embedded
# Ed25519 minisign public key before offering or installing any update.
minisign-verify = "0.3"

# Compares release versions against the package version, hashes downloads for
# integrity checks, and stages installers in an isolated temporary directory.
semver = "1"
sha2 = "0.11"
hex = "0.4"
tempfile = "3.27.0"

# Only the X11 window icon is passed in as pixels. GPUI already depends on
# `image`, but it is not re-exported, so the app names it here; the png feature
# is the only decoder this needs.
[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

# Embeds resources/icon/strata.ico in the Windows executable (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
strata-core = { workspace = true, features = ["test-support"] }
# Generates ephemeral test keypairs and signatures for updater verification tests.
minisign = "0.10"
# `TestAppContext` and `#[gpui::test]`, for the tests that check a view is
# actually released. Test-only: the binary is built without it.
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
