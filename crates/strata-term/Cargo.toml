[package]
name = "strata-term"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UI-independent embedded terminal core built on libghostty-vt and portable-pty"
repository.workspace = true
homepage.workspace = true

[dependencies]
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
flate2 = "1"
sha2 = "0.11"
tar = "0.4"

[dev-dependencies]
futures = "0.3"
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", features = [
    "font-kit",
    "wayland",
    "x11",
] }
