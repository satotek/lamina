[package]
name = "lamina-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Headless repository helper for Lamina over a byte stream"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lamina-remote"
path = "src/main.rs"

[dependencies]
lamina-core = { workspace = true }
lamina-remote-protocol = { workspace = true }

[dev-dependencies]
lamina-core = { workspace = true, features = ["test-support"] }
lamina-remote-client = { workspace = true }
